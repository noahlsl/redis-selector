name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Core tests
        run: go test ./... -race -count=1
      - name: Adapter builds
        run: |
          for dir in adapter/*/; do
            (cd "$dir" && go build ./...)
          done
      - name: Example and adapter tests
        working-directory: example
        run: go test ./... -count=1
